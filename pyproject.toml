[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-alert"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "vulture>=2.11",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "C901", # 인지복잡도
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-fail-under=80"
testpaths = ["tests"]

[tool.vulture]
min_confidence = 80
paths = ["."]
ignore_names = ["test_*"]
exclude = [".venv", "tests"]
